name: Build, Test and Publish

on:
  push:
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

env:
  VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || '3.1.1-SNAPSHOT' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Assemble JARs and documentation
        run: ./gradlew --no-daemon clean assemble

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Run unit tests
        run: ./gradlew --no-daemon unitTest

  parity-tests:
    name: C/C++ parity tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Show native compiler versions
        run: |
          clang --version
          clang++ --version
      - name: Run parity and sample tests
        run: ./gradlew --no-daemon parityTest

  publish:
    name: Publish to Maven Central
    needs: [build, unit-tests, parity-tests]
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
      SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Validate publishing secrets
        shell: bash
        run: |
          missing=0
          for name in SONATYPE_USERNAME SONATYPE_PASSWORD GPG_PRIVATE_KEY GPG_PASSPHRASE; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing repository secret: ${name}"
              missing=1
            fi
          done
          exit "${missing}"
      - name: Publish snapshot
        if: github.event_name == 'push'
        run: ./gradlew --no-daemon publishToSonatype --stacktrace
      - name: Publish release
        if: github.event_name == 'release'
        run: >-
          ./gradlew --no-daemon
          publishToSonatype
          closeAndReleaseSonatypeStagingRepository
          --stacktrace
