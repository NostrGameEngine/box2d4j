plugins {
    id 'java-library'
    id 'application'
    id 'maven-publish'
    id 'signing'
    id 'io.github.gradle-nexus.publish-plugin' version '2.0.0'
}

group = System.getenv('GROUP') ?: 'org.ngengine'
def requestedVersion = System.getenv('VERSION') ?: '3.1.1-SNAPSHOT'
version = requestedVersion.startsWith('v') ? requestedVersion.substring(1) : requestedVersion
description = 'Java 11 port of Box2D 3.1.1'

def githubRepository = System.getenv('GITHUB_REPOSITORY') ?: 'NostrGameEngine/box2d4j'
def projectWebsite = "https://github.com/${githubRepository}"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(11)
    }
    withSourcesJar()
    withJavadocJar()
}

sourceSets {
    samples {
        java.srcDir 'src/samples/java'
        compileClasspath += sourceSets.main.output + configurations.runtimeClasspath
        runtimeClasspath += output + compileClasspath
    }
    debugger {
        java.srcDir 'src/debugger/java'
        compileClasspath += sourceSets.main.output + sourceSets.samples.output
        runtimeClasspath += output + compileClasspath
    }
}

dependencies {
    testImplementation sourceSets.samples.output
    testImplementation sourceSets.debugger.output
    testImplementation platform('org.junit:junit-bom:5.13.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    debuggerImplementation sourceSets.main.output
    debuggerImplementation sourceSets.samples.output
    debuggerImplementation 'org.jmonkeyengine:jme3-core:3.9.0-stable'
    debuggerImplementation 'org.jmonkeyengine:jme3-desktop:3.9.0-stable'
    debuggerImplementation 'org.jmonkeyengine:jme3-lwjgl3:3.9.0-stable'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 11
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
}

def parityTestClassPatterns = [
    'org.box2d4j.*ParityTest',
    'org.box2d4j.*SampleTest',
    'org.box2d4j.MultithreadingTest'
]

tasks.register('unitTest', Test) {
    group = 'verification'
    description = 'Runs the fast Java unit and API-surface tests.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter {
        includeTestsMatching('org.box2d4j.*')
        includeTestsMatching('org.box2d4j.debugger.*')
        parityTestClassPatterns.each { classPattern ->
            excludeTestsMatching(classPattern)
        }
        failOnNoMatchingTests = true
    }
}

tasks.register('parityTest', Test) {
    group = 'verification'
    description = 'Runs C/C++ parity probes and sample parity tests.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter {
        parityTestClassPatterns.each { classPattern ->
            includeTestsMatching(classPattern)
        }
        failOnNoMatchingTests = true
    }
}

tasks.named('jar') {
    from('LICENSE') {
        into 'META-INF'
    }
}

nexusPublishing {
    repositories {
        sonatype {
            nexusUrl.set(uri('https://ossrh-staging-api.central.sonatype.com/service/local/'))
            snapshotRepositoryUrl.set(uri('https://central.sonatype.com/repository/maven-snapshots/'))
            username = System.getenv('SONATYPE_USERNAME') ?: findProperty('sonatypeUsername') ?: ''
            password = System.getenv('SONATYPE_PASSWORD') ?: findProperty('sonatypePassword') ?: ''
            packageGroup = project.group.toString()
        }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            groupId = project.group.toString()
            artifactId = rootProject.name
            version = project.version.toString()

            pom {
                name = 'box2d4j'
                description = project.description
                url = projectWebsite
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                        distribution = 'repo'
                    }
                }
                developers {
                    developer {
                        id = 'rblb'
                        name = 'Riccardo Balbo'
                        email = 'os@rblb.it'
                    }
                }
                scm {
                    connection = "scm:git:https://github.com/${githubRepository}.git"
                    developerConnection = "scm:git:ssh://git@github.com/${githubRepository}.git"
                    url = projectWebsite
                }
            }
        }
    }
    repositories {
        maven {
            name = 'distFolder'
            url = layout.buildDirectory.dir('repository')
        }
    }
}

def signingKey = System.getenv('GPG_PRIVATE_KEY') ?: findProperty('signingKey')
def signingPassword = System.getenv('GPG_PASSPHRASE') ?: findProperty('signingPassword')
if (signingKey && signingPassword) {
    signing {
        useInMemoryPgpKeys(signingKey, signingPassword)
        sign publishing.publications.mavenJava
    }
}

tasks.withType(Sign).configureEach {
    onlyIf { signingKey && signingPassword }
}

application {
    mainClass = 'org.box2d4j.samples.HelloWorld'
}

tasks.register('runSamples', JavaExec) {
    group = 'application'
    description = 'Runs the headless Box2D sample suite.'
    classpath = sourceSets.samples.runtimeClasspath
    mainClass = 'org.box2d4j.samples.SampleRunner'
}

tasks.register('runDebugger', JavaExec) {
    group = 'application'
    description = 'Runs the interactive jMonkeyEngine Box2D sample debugger.'
    classpath = sourceSets.debugger.runtimeClasspath
    mainClass = 'org.box2d4j.debugger.Box2D4JDebugger'
    environment '__GL_THREADED_OPTIMIZATIONS', '0'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(11)
    }
    if (System.getProperty('os.name').toLowerCase().contains('mac')) {
        jvmArgs '-XstartOnFirstThread'
    }
    if (project.hasProperty('debuggerScreenshot')) {
        systemProperty 'box2d4j.debugger.screenshot', project.property('debuggerScreenshot')
    }
    if (project.hasProperty('debuggerSample')) {
        systemProperty 'box2d4j.debugger.sample', project.property('debuggerSample')
    }
    if (project.hasProperty('debuggerWorkers')) {
        systemProperty 'box2d4j.debugger.workers', project.property('debuggerWorkers')
    }
}
